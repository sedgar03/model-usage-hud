[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-usage-hud"
version = "0.1.0"
description = "Unified terminal HUD for Claude Code, OpenAI Codex, and Gemini usage"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Steven Edgar" }]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
usage-hud = "model_usage_hud.cli:main"
usage-hud-app = "model_usage_hud.app.main:main"

[tool.setuptools]
py-modules = ["usage_hud"]

[tool.setuptools.packages.find]
include = ["model_usage_hud*"]

[tool.setuptools.package-data]
"model_usage_hud.app" = [
    "assets/providers/*.svg",
    "assets/providers/LICENSE-*",
    "assets/icons/*.svg",
    "assets/icons/LICENSE-*",
]
